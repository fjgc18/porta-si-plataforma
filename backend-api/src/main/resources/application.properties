# =============================================
#  PORTA SI \u00e2\u0080\u0094 Application Properties
# =============================================

server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3307/porta_si?useSSL=false&serverTimezone=America/Hermosillo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=portaSI_SecretKey_2026_Enterprise_Platform_MuySeguraYLarga_256bits
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# --- File Upload ---
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# --- Logging ---
logging.level.com.portasi=DEBUG
logging.level.org.springframework.security=WARN
